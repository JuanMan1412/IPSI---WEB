<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2557"/>
      <stop offset="55%" stop-color="#173a7a"/>
      <stop offset="100%" stop-color="#0e2557"/>
    </linearGradient>
    <linearGradient id="rojoFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8232f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#b8232f" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>

  <!-- franja roja diagonal, sutil, lado derecho -->
  <path d="M1600 0 L1050 0 L1600 900 Z" fill="url(#rojoFade)"/>

  <!-- arcos grandes, en eco de las tres columnas del isologo del colegio -->
  <g opacity=".5">
    <path d="M60 900 V560 a120 120 0 0 1 240 0 V900 Z" fill="#ffffff" opacity=".05"/>
    <path d="M260 900 V420 a120 120 0 0 1 240 0 V900 Z" fill="#ffffff" opacity=".08"/>
    <path d="M460 900 V320 a120 120 0 0 1 240 0 V900 Z" fill="#b8232f" opacity=".16"/>
  </g>

  <!-- resplandores suaves -->
  <circle cx="1280" cy="190" r="340" fill="url(#glow)"/>
  <circle cx="220" cy="120" r="220" fill="url(#glow)"/>

  <!-- líneas finas, textura sutil -->
  <g stroke="#ffffff" stroke-opacity=".07" stroke-width="2">
    <line x1="0" y1="760" x2="1600" y2="760"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
  </g>
</svg>
